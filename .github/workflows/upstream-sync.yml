name: Upstream Sync

# Keeps the `master` mirror fast-forwarded to upstream
# (deepseek-ai/deepseek-harness) and opens an integration PR into the fork's
# working branch `dev/compat` when upstream introduces new commits. A human
# reviews and resolves conflicts before merging into dev/compat.
#
# Scheduled runs only fire from the repository's default branch, so this file
# must live on the default branch (set it to dev/compat) for the cron to
# trigger. workflow_dispatch "Use workflow from" must also be `dev/compat`:
# this file is absent from the upstream-identical `master`. That picker
# selects which YAML revision to run, not which branch to fast-forward.
#
# `github.token` cannot create or update `.github/workflows/*`. Checkout and
# the mirror push therefore authenticate with repository secret
# `UPSTREAM_SYNC_TOKEN` (a fine-grained PAT with Contents, Pull requests, and
# Workflows read/write, or a classic PAT with `repo` and `workflow`). Do not
# store a GitHub App installation token: those expire in one hour, so a static
# secret cannot survive the daily cron. The integration PR is opened with REST
# `POST /repos/{owner}/{repo}/pulls`: `gh pr create` uses GraphQL
# `createPullRequest`, which fine-grained PATs reject even with Pull requests
# write. A token-authenticated push to `master` fires this fork's still-enabled
# `on: push` workflows; operators disable upstream `CI` and `CI master` so
# private-runner jobs do not queue. Rationale:
# .agents/notes/implemented/process/2026-08-26-fork-upstream-sync.md

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

# Only the source fork runs this; forks-of-the-fork must not mirror.
# These permissions apply to `github.token` only; the PAT carries its own scopes.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/deepseek-ai/deepseek-harness.git
  UPSTREAM_BRANCH: master
  MIRROR_BRANCH: master
  INTEGRATION_BRANCH: dev/compat

jobs:
  sync:
    if: github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
    steps:
      - name: Require UPSTREAM_SYNC_TOKEN
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret UPSTREAM_SYNC_TOKEN is empty. github.token cannot create or update files under .github/workflows/. Store a fine-grained PAT (Contents, Pull requests, and Workflows: Read and write) or a classic PAT (repo and workflow) as Actions secret UPSTREAM_SYNC_TOKEN. A GitHub App installation token expires in one hour and cannot be this static secret. Disable the upstream CI master workflow so a token-authenticated master push does not queue private-runner jobs."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream and mirror refs
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git fetch --no-tags origin "$MIRROR_BRANCH" "$INTEGRATION_BRANCH"

      - name: Fast-forward the mirror branch
        run: |
          # `master` is a pure upstream mirror: only ever fast-forward it.
          # A non-ancestor origin/master means someone committed to the mirror;
          # fail loudly instead of force-pushing over it.
          if git merge-base --is-ancestor "origin/$MIRROR_BRANCH" "upstream/$UPSTREAM_BRANCH"; then
            if [ "$(git rev-parse "origin/$MIRROR_BRANCH")" = "$(git rev-parse "upstream/$UPSTREAM_BRANCH")" ]; then
              echo "Mirror already up to date."
            else
              git push origin "upstream/$UPSTREAM_BRANCH:refs/heads/$MIRROR_BRANCH"
              echo "Mirror fast-forwarded to upstream/$UPSTREAM_BRANCH."
            fi
          else
            echo "::error::origin/$MIRROR_BRANCH has commits absent from upstream/$UPSTREAM_BRANCH; refusing to force. Investigate divergence."
            exit 1
          fi

      - name: Open or refresh integration PR (master -> dev/compat)
        env:
          ACTIONS_GH_TOKEN: ${{ github.token }}
        run: |
          behind="$(git rev-list --count "origin/$INTEGRATION_BRANCH..upstream/$UPSTREAM_BRANCH")"
          if [ "$behind" -eq 0 ]; then
            echo "$INTEGRATION_BRANCH already contains upstream; no integration PR needed."
            exit 0
          fi
          head_ref="${GITHUB_REPOSITORY_OWNER}:${MIRROR_BRANCH}"
          existing="$(gh api \
            -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f base="$INTEGRATION_BRANCH" \
            -f head="$head_ref" \
            --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Integration PR #$existing is open and tracks $MIRROR_BRANCH automatically ($behind commit(s) ahead)."
            exit 0
          fi
          title="chore: 集成上游更新 (${MIRROR_BRANCH} → ${INTEGRATION_BRANCH})"
          body="自动创建:上游 \`${UPSTREAM_BRANCH}\` 有 ${behind} 个 \`${INTEGRATION_BRANCH}\` 尚未包含的提交。请审核并解决可能的冲突后合并。"
          payload="$(jq -n \
            --arg title "$title" \
            --arg body "$body" \
            --arg head "$MIRROR_BRANCH" \
            --arg base "$INTEGRATION_BRANCH" \
            '{title:$title,body:$body,head:$head,base:$base}')"
          create_with() {
            # Fine-grained PATs can POST /pulls while GraphQL createPullRequest
            # still returns "Resource not accessible by personal access token".
            GH_TOKEN="$1" gh api "repos/${GITHUB_REPOSITORY}/pulls" --method POST --input - --jq '"Opened integration PR #\(.number) \(.html_url)"' <<<"$payload"
          }
          if create_with "$GH_TOKEN"; then
            exit 0
          fi
          if create_with "$ACTIONS_GH_TOKEN"; then
            exit 0
          fi
          echo "::error::Could not create the ${MIRROR_BRANCH} → ${INTEGRATION_BRANCH} integration PR via REST POST /repos/{owner}/{repo}/pulls. gh pr create is not used: GraphQL createPullRequest rejects fine-grained PATs even with Pull requests write. Confirm UPSTREAM_SYNC_TOKEN has Contents, Pull requests, and Workflows: Read and write. If falling back to github.token, enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests."
          exit 1
