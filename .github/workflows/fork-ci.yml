name: Fork CI

# Fork-owned gate for onlyfeng/deepseek-harness on GitHub-hosted runners.
#
# The upstream `CI` workflow (ci.yml) binds its coverage, static, consumer, and
# windows-native jobs to private runner labels (dsh-ubuntu-24-04-16core,
# dsh-windows-2025-16core) this fork does not have, so those jobs queue forever
# and its `all checks passed` aggregate never settles. The upstream `CI`
# workflow is therefore disabled on this fork (Actions tab -> CI -> Disable
# workflow) and this workflow gates the fork's changes on hosted runners
# instead. This file does not exist upstream, so syncing upstream never
# conflicts with it.
#
# Coverage relative to the disabled upstream CI:
#   - check:ci:static (with archive base-ref), then build:lib:host, then
#     typecheck:contracts-ready and lint:contracts-ready. The static aggregate
#     covers runtime-closure, workspace constraints, package invariants, Cordis
#     config, documentation, catalogs, module-graph, and knip; it does not own
#     typecheck or lint. Client tsc resolves generated Typert remotes, so the
#     Host contract build must run first (upstream does that on the consumer
#     lane via typertContractsGate()).
#   - snapshots: prepare-ci-bubblewrap.sh, then official `pnpm run build`
#     (DSH_BUILD_CLIENT_PROFILE=official) then DSH_EXAMPLE_MODE=lib
#     test:snapshot with `-t '!persistent-pwsh-tool-turn'` — the same
#     snapshotGate() the consumer lane uses, minus the hosted persistent PTY
#     run. Lib-mode Web and sandbox-policy session events need a usable
#     bubblewrap backend on hosted Ubuntu; GITHUB_PATH from the prepare script
#     applies to later steps. DSH_SNAPSHOT_MAX_CONCURRENCY=1 so the SSE
#     keep-alive comment test is not starved. The persistent PTY returns
#     shell-init scrollback on GitHub-hosted images; fixture guards still run.
#     The skip lives in this file only so merging master does not conflict on
#     snapshot.yml or session-snapshot.
#   - check:ci:artifacts, then duplication, built-output doc typecheck, and
#     Playwright web snapshots: the consumer-lane artifact checks that
#     snapshots omit (publint, built-package invariants, verify-node-next-types,
#     built-bin smokes), then prepare-ci-bubblewrap.sh, Chromium via
#     playwright install --with-deps, and DSH_SNAPSHOT=replay test:web:ci.
#     Lib-mode Web snapshots request workspace-write and refuse to run
#     unconfined. Hosted ubuntu-latest has 4 CPUs, so
#     DSH_WEB_SNAPSHOT_WORKERS=2 (upstream uses 6 on the 16-core pool).
#   - node-compat matrix (22.19, 24, and 26): the hosted 22.19/26 smokes plus
#     the Node 24 check:node-compat the disabled consumer lane ran.
#   - python-sdk and python-runtime: the hosted Python SDK suite and the
#     release-shaped Linux x64 runtime builder.
#   - wine Windows gate: the same hosted `windows` lane ci.yml runs on
#     ubuntu-latest (workspace build + production site under win-x64 Node).
# The full `pnpm run test` / check:ci:coverage unit suite is NOT gated here:
# its shell/terminal/pwsh integration suites (packages/terminal, packages/shell)
# depend on a tuned PTY/PowerShell runner and flake on GitHub-hosted runners,
# and the repo's vitest `projects` config cannot exclude them from the CLI
# without editing the upstream config (which would conflict on every upstream
# sync). Run `pnpm run test` locally. windows-native stays omitted: it requires
# the private Windows runner this fork does not have.

on:
  pull_request:
  push:
    branches:
      - dev/compat

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  # `pnpm run` otherwise re-runs `pnpm install` before each script
  # (verifyDepsBeforeRun=install), re-triggering the lefthook postinstall.
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: node 24 / static, typecheck, lint
    # Guard so a fork-of-this-fork does not inherit the gate under a wrong repo.
    if: github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DSH_GATE_CONCURRENCY: '4'
    steps:
      # Fetch complete history so the archive gate can read the trusted base
      # from a reused shallow checkout.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm run check:ci:static

      # Client tsc (`typecheck:contracts-ready`) resolves generated Typert
      # remotes such as `@deepseek-ai/dsh-commands/remote`. Those files exist
      # only after the Host contract build; the static aggregate does not emit
      # them. Upstream's consumer lane runs the same `build:lib:host` step as
      # typertContractsGate() before this typecheck.
      - name: Build Host contracts
        run: pnpm run build:lib:host

      - name: Typecheck
        run: pnpm run typecheck:contracts-ready

      - name: Lint
        run: pnpm run lint:contracts-ready

  snapshots:
    name: node 24 / snapshots
    if: github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DSH_GATE_CONCURRENCY: '4'
      # Hosted ubuntu-latest has 4 CPUs; parallel snapshot files starve the
      # DeepSeek SSE keep-alive comment test (streamIdleTimeoutMs 150).
      DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Lib-mode Web snapshots request workspace-write and refuse to run
      # unconfined. ACP/headless sessions without a usable sandbox backend
      # inject a danger-full-access runtime-context snapshot that fixtures
      # recorded with bubblewrap do not contain. The script writes bwrap onto
      # GITHUB_PATH for later steps; the functional probe is the authority.
      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Same graph as snapshotGate() (official build, then lib-mode
      # test:snapshot), minus the persistent-pwsh-tool-turn run. Hosted
      # persistent PTYs return shell-init scrollback, not PWSH_OK.
      # snapshot.yml rejects unknown skip fields; this vitest filter is
      # fork-only so merging master does not re-conflict.
      - name: Official build for snapshots
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run build

      - name: Run snapshot aggregate except hosted persistent pwsh PTY
        env:
          DSH_EXAMPLE_MODE: lib
        run: "pnpm run test:snapshot -- -t '!persistent-pwsh-tool-turn'"

  artifacts:
    name: node 24 / artifacts and web snapshots
    if: github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DSH_GATE_CONCURRENCY: '4'
      # Hosted ubuntu-latest has 4 CPUs; upstream uses 6 workers on the 16-core
      # consumer pool. test:web:ci requires an integer greater than 1.
      DSH_WEB_SNAPSHOT_WORKERS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Lib-mode Web snapshots request workspace-write and refuse to run
      # unconfined. The script writes bwrap onto GITHUB_PATH for later steps;
      # the functional probe is the authority.
      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Official build plus publint, built-package invariants, NodeNext types,
      # and built-bin smokes. Snapshots already run snapshotGate(); this job
      # owns the remaining consumer-lane artifact checks. Duplication and
      # built-output doc typecheck sit in ciConsumerGates() beside those
      # checks and are not inside check:ci:artifacts. Web snapshots consume
      # apps/web/dist and package lib/client.js from that official build.
      - name: Run artifact aggregate
        run: pnpm run check:ci:artifacts

      - name: Duplication
        run: pnpm run duplication

      - name: Built-output doc typecheck
        env:
          DSH_DOC_TYPECHECK_USE_BUILD_OUTPUT: '1'
        run: pnpm run doc-typecheck:contracts-ready

      - name: Install Playwright Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Run web browser snapshots
        env:
          DSH_SNAPSHOT: replay
        run: pnpm run test:web:ci

  node-compat:
    if: github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    timeout-minutes: 45
    env:
      DSH_GATE_CONCURRENCY: ${{ matrix.gate_concurrency }}
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.19'
            name: node 22.19
            runner: ubuntu-latest
            gate_concurrency: '1'
          - node: 24
            name: node 24
            runner: ubuntu-latest
            gate_concurrency: '1'
          - node: 26
            name: node 26
            runner: ubuntu-latest
            gate_concurrency: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run compatibility smokes
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run check:node-compat

  python-sdk:
    if: github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ubuntu-latest
    name: python 3.10 / keyless SDK
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - name: Run complete keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest

  python-runtime:
    if: github.repository == 'onlyfeng/deepseek-harness'
    name: python runtime / release-shaped Linux x64
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-x64
      ci: true

  windows:
    name: windows node 24 / wine blocking
    if: github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      # Runner provisioning only: the gate script assumes a wine binary and
      # fails loud without one. The `wine` dispatcher package puts the binary
      # on PATH. The script does its own scratch snapshot + install, so no
      # root `pnpm install` is needed here.
      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine

      - name: Run the Wine Windows gates
        run: bash scripts/wine-windows-gates.sh

      - name: Shut down wineserver
        if: always()
        run: wineserver -k 2>/dev/null || true

  fork-checks-passed:
    name: fork checks passed
    needs: [static, snapshots, artifacts, node-compat, python-sdk, python-runtime, windows]
    # always() so a failed dependency fails this gate instead of skipping it
    # (a skipped required check counts as passing on GitHub).
    if: always() && github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All fork checks passed (${{ join(needs.*.result, ', ') }})"
