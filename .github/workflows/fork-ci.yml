name: Fork CI

# Fork-owned gate for onlyfeng/deepseek-harness on GitHub-hosted runners.
#
# The upstream `CI` workflow (ci.yml) binds its coverage, static, consumer, and
# windows-native jobs to private runner labels (dsh-ubuntu-24-04-16core,
# dsh-windows-2025-16core) this fork does not have, so those jobs queue
# forever and its `all checks passed` aggregate never settles. Disable the
# upstream `CI` workflow on this fork (Actions tab -> CI -> Disable workflow)
# and let this workflow gate the fork's changes instead. This file does not
# exist upstream, so syncing upstream never conflicts with it.

on:
  pull_request:
  push:
    branches:
      - dev/compat

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: build, typecheck, lint, test
    # Guard so a fork-of-this-fork does not inherit the gate under a wrong repo.
    if: github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ubuntu-latest
    env:
      # `pnpm run` otherwise re-runs `pnpm install` before each script
      # (verifyDepsBeforeRun=install), re-triggering the lefthook postinstall.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build host lib
        run: pnpm run build:lib:host

      - name: Typecheck
        run: pnpm run typecheck:contracts-ready

      - name: Lint
        run: pnpm run lint:contracts-ready

      - name: Unit tests
        run: pnpm run test

  fork-checks-passed:
    name: fork checks passed
    needs: [checks]
    # always() so a failed dependency fails this gate instead of skipping it
    # (a skipped required check counts as passing on GitHub).
    if: always() && github.repository == 'onlyfeng/deepseek-harness'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All fork checks passed (${{ join(needs.*.result, ', ') }})"
